version: 2

models:
  - name: interview_model_ehs_out
    description: "Canonical union of EHS_IN standardized feeds"
    columns:
      - name: customer_short_code
        tests: [not_null]
      - name: dc_site_code
        tests: [not_null]
      - name: asset_id
        tests: [not_null]
      - name: event_dts
        tests: [not_null]
      - name: datapoint
        tests: [not_null]
      - name: is_imputed
        tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_short_code, dc_site_code, asset_id, event_dts, datapoint]
